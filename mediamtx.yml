###############################################
# Global settings

logLevel: info
logDestinations: [stdout]
logFile: mediamtx.log

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1472

###############################################
# Global settings -> Authentication

authMethod: internal

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
    - action: publish
      path:
    - action: read
      path:
    - action: playback
      path:

  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
    - action: api
    - action: metrics
    - action: pprof

authHTTPAddress:
authHTTPExclude:
- action: api
- action: metrics
- action: pprof

authJWTJWKS:

###############################################
# Global settings -> Control API

api: yes
apiAddress: 127.0.0.1:9997
apiEncryption: no
apiServerKey: server.key
apiServerCert: server.crt
apiAllowOrigins: ['*']

###############################################
# Global settings -> Metrics

metrics: no
metricsAddress: :9998
metricsEncryption: no
metricsServerKey: server.key
metricsServerCert: server.crt
metricsAllowOrigins: ['*']

###############################################
# Global settings -> PPROF

pprof: no
pprofAddress: :9999
pprofEncryption: no
pprofServerKey: server.key
pprofServerCert: server.crt
pprofAllowOrigins: ['*']

###############################################
# Global settings -> Playback server

playback: no
playbackAddress: :9996
playbackEncryption: no
playbackServerKey: server.key
playbackServerCert: server.crt
playbackAllowOrigins: ['*']

###############################################
# Global settings -> RTSP server

rtsp: yes
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001
multicastIPRange: 224.1.0.0/16
multicastRTPPort: 8002
multicastRTCPPort: 8003
rtspServerKey: server.key
rtspServerCert: server.crt
rtspAuthMethods: [basic]

###############################################
# Global settings -> RTMP server

rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
rtmpsAddress: :1936
rtmpServerKey: server.key
rtmpServerCert: server.crt

###############################################
# Global settings -> HLS server

hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsServerKey: server.key
hlsServerCert: server.crt
hlsAllowOrigins: ['*']
hlsTrustedProxies: []
hlsAlwaysRemux: yes
hlsVariant: fmp4
hlsSegmentCount: 12
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 200M
hlsDirectory: ''
hlsMuxerCloseAfter: 60s

###############################################
# Global settings -> WebRTC server

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcServerKey: server.key
webrtcServerCert: server.crt
webrtcAllowOrigins: ['*']
webrtcTrustedProxies: []
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: yes
webrtcIPsFromInterfacesList: []
webrtcAdditionalHosts: []
webrtcICEServers2: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 2s

###############################################
# Global settings -> SRT server

srt: yes
srtAddress: :8890

###############################################
# Default path settings

pathDefaults:
  source: publisher
  record: no
  useAbsoluteTimestamp: false
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 2s
  recordSegmentDuration: 60s
  recordDeleteAfter: 0s

###############################################
# Path settings

paths:
  # CAM1 - RTMP publisher input (stream key: cam1, app: live -> path: live/cam1)
  live/cam1:
    source: publisher
    record: no
    useAbsoluteTimestamp: false

  # CAM2 - RTMP publisher input (stream key: cam2, app: live -> path: live/cam2)
  live/cam2:
    source: publisher
    record: no
    useAbsoluteTimestamp: false

  # CAM1 - AI-Annotated H.264 output.
  live/cam1-ai:
    source: publisher
    record: no
    useAbsoluteTimestamp: false

  # CAM2 - AI-Annotated H.264 output.
  live/cam2-ai:
    source: publisher
    record: no
    useAbsoluteTimestamp: false

  # Settings under path "all_others" are applied to all paths that
  # do not match another entry.
  all_others:
    record: no
    useAbsoluteTimestamp: false