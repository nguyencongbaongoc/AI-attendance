# Default configuration for AI Attendance System
# This file provides default values for all configuration sections.
# Environment variables and .env file can override these values.

runtime:
  log_level: INFO
  debug: false

paths:
  # Paths are resolved relative to project root by default
  config_dir: config
  models_dir: models
  logs_dir: logs
  data_dir: data
  recordings_dir: recordings
  benchmark_results_dir: benchmark_results

models:
  scrfd_dir: models/scrfd
  arcface_dir: models/arcface
  landmark_dir: models/landmark
  reid_dir: models/reid
  yolo_dir: models/yolo

cameras:
  # Camera configuration will be implemented in later phases
  # Do NOT add camera configuration yet
  # Do NOT add automatic camera discovery
  # Do NOT add arbitrary RTSP fallback

media:
  # Explicit FFmpeg path (optional). If null, system PATH is used.
  ffmpeg_path: null

  # Video encode/decode backend selection (Phase 9.3+ / Phase 10)
  # Canonical production runtime is PyNvVideoCodec (Backend B) with PyAV NVDEC fallback (Backend A).
  # "pynvvideocodec" -> PyNvVideoCodec direct NVDEC + Shared CUDA Context + GPU AI + GPU annotation + Native NVENC
  # "pyav_nvdec" -> PyAV NVDEC fallback (Backend A)
  video_encode_backend: "nvenc"
  video_decode_backend: "pynvvideocodec"

  # NVDEC Configuration (Phase 9.3+ — PyNvVideoCodec direct NVDEC production)
  nvdec_enabled: true
  nvdec_gpu_device: 0
  nvdec_surfaces: 32
  nvdec_output_mode: "gpu"  # GPU-resident CUDA frames via PyNvVideoCodec
  # Explicit gate to prevent silent software fallback
  allow_software_fallback: false

  # PyAV publisher path (available as alternative)
  pyav_publisher_enabled: true

  # NVENC Configuration (Phase 9.5 Production)
  nvenc_enabled: true
  nvenc_gpu_device: 0
  nvenc_preset: "p1"
  nvenc_tune: "ll"
  nvenc_rc: "cbr"

  # GPU Pipeline Configuration
  gpu_pipeline_enabled: true
  gpu_annotation_enabled: true
  nvenc_direct_gpu: true

inference:
  device: auto  # auto, cpu, cuda
  batch_size: 1

tracking:
  # Tracking configuration will be implemented in later phases

attendance:
  # Attendance configuration will be implemented in later phases

stranger:
  # Stranger detection configuration will be implemented in later phases

geometry:
  # Geometry configuration will be implemented in later phases

storage:
  # Storage configuration will be implemented in later phases

monitoring:
  # Monitoring configuration will be implemented in later phases