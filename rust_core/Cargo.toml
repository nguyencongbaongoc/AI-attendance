[package]
name = "attendance_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "attendance_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
ndarray = "0.16"
rayon = "1.10"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
